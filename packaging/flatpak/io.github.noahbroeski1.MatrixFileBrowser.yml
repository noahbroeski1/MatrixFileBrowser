# Flatpak manifest for MatrixFileBrowser.
# Build with: flatpak-builder --user --install --force-clean build-dir packaging/flatpak/io.github.noahbroeski1.MatrixFileBrowser.yml
# Status: scaffold, not yet tested in CI.
app-id: io.github.noahbroeski1.MatrixFileBrowser
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: matrix-file-browser
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.FileManager1
modules:
  - name: matrix-file-browser
    buildsystem: simple
    build-commands:
      - export PATH=$PATH:/usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
      - export CARGO_HOME=/run/build/matrix-file-browser/cargo
      - export RUSTUP_HOME=/run/build/matrix-file-browser/rustup
      - npm ci
      - npm run tauri build
      - install -Dm755 src-tauri/target/release/matrix-file-browser /app/bin/matrix-file-browser
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/io.github.noahbroeski1.MatrixFileBrowser.png
      - install -Dm644 packaging/flatpak/io.github.noahbroeski1.MatrixFileBrowser.desktop /app/share/applications/io.github.noahbroeski1.MatrixFileBrowser.desktop
      - install -Dm644 packaging/flatpak/io.github.noahbroeski1.MatrixFileBrowser.metainfo.xml /app/share/metainfo/io.github.noahbroeski1.MatrixFileBrowser.metainfo.xml
    sources:
      - type: dir
        path: ../..
