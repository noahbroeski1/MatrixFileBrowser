[workspace]
resolver = "2"
members = [
    "crates/matrix-core",
    "crates/matrix-thumbs",
    "crates/matrix-aggregate",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/noahbroeski1/MatrixFileBrowser"
rust-version = "1.77"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rayon = "1.10"
# `pure` keeps the build free of a C toolchain for the hash core.
blake3 = { version = "1.5", default-features = false, features = ["std", "pure"] }
mime_guess = "2.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
